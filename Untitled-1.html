<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Тест</title></head>
<body style="font-family:sans-serif;padding:40px;text-align:center;font-size:20px">
    <h1>Тест JavaScript</h1>
    <p id="result">Если ты видишь это — JavaScript НЕ работает</p>
    <button onclick="document.getElementById('result').innerText='✅ JavaScript РАБОТАЕТ!'"
            style="font-size:20px;padding:16px 32px;margin-top:20px;cursor:pointer">
        Нажми меня
    </button>
    <script>
        document.getElementById('result').innerText = '✅ Скрипт выполнился при загрузке';
    </script>
</body>
</html>
